<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ミライ建設ナビ</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="replica">
      <section class="frame frame--desktop" aria-label="Desktop Figma replica">
        <img
          class="frame__image"
          src="./assets/images/figma-desktop.jpg"
          alt="ミライ建設ナビ ランディングページ デスクトップデザイン"
          width="1440"
          height="15312"
        />

        <a class="hotspot" style="left:70.4%;top:0.08%;width:12.8%;height:0.24%;" href="#" aria-label="WEBで相談してみる"></a>
        <a class="hotspot" style="left:84.0%;top:0.08%;width:14.0%;height:0.24%;" href="#" aria-label="まず、不安を話してみる"></a>
        <a class="hotspot" style="left:65.6%;top:2.72%;width:26.2%;height:3.68%;" href="#" aria-label="無料相談フォーム"></a>
        <a class="hotspot" style="left:96.1%;top:4.66%;width:3.9%;height:1.75%;" href="#" aria-label="WEBを相談してみる"></a>
        <a class="hotspot" style="left:23.0%;top:50.95%;width:54.2%;height:2.95%;" href="#" aria-label="キャリア相談 CTA 1"></a>
        <a class="hotspot" style="left:23.0%;top:74.38%;width:54.2%;height:2.95%;" href="#" aria-label="キャリア相談 CTA 2"></a>
        <a class="hotspot" style="left:22.9%;top:94.52%;width:54.4%;height:2.95%;" href="#" aria-label="キャリア相談 CTA 3"></a>
      </section>

      <section class="frame frame--mobile" aria-label="Mobile Figma replica">
        <img
          class="frame__image"
          src="./assets/images/figma-mobile.jpg"
          alt="ミライ建設ナビ ランディングページ モバイルデザイン"
          width="375"
          height="14689"
        />

        <a class="hotspot" style="left:11.5%;top:2.65%;width:77.4%;height:3.2%;" href="#" aria-label="無料相談フォーム"></a>
        <a class="hotspot" style="left:6.0%;top:51.0%;width:88%;height:2.9%;" href="#" aria-label="キャリア相談 CTA 1"></a>
        <a class="hotspot" style="left:6.0%;top:74.2%;width:88%;height:2.9%;" href="#" aria-label="キャリア相談 CTA 2"></a>
        <a class="hotspot" style="left:6.0%;top:94.3%;width:88%;height:2.9%;" href="#" aria-label="キャリア相談 CTA 3"></a>
      </section>
    </main>

    <div class="mobile-sticky" aria-label="Mobile sticky CTA">
      <a class="mobile-sticky__tel" href="tel:06-6961-3344" aria-label="今すぐ電話相談"></a>
      <a class="mobile-sticky__web" href="#" aria-label="WEBで相談してみる"></a>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
